<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: patched llama.cpp emits a heat log to the Go collector, which derives the Pareto working set; the cold-tier runtime (mmap SSD + LRU) serves cold lookups back to llama.cpp">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- Static base connectors (top row + return path). -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="197" y1="155" x2="233" y2="155" marker-end="url(#ah-l)"/>
    <line x1="417" y1="155" x2="453" y2="155" marker-end="url(#ah-l)"/>
    <line x1="637" y1="155" x2="673" y2="155" marker-end="url(#ah-l)"/>
    <path d="M770,201 L770,290 L110,290 L110,201" marker-end="url(#ah-l)"/>
  </g>

  <!-- Marching-dash data flow over the connectors (direction = data direction). -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="197" y1="155" x2="233" y2="155" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="417" y1="155" x2="453" y2="155" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="637" y1="155" x2="673" y2="155" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.0s" repeatCount="indefinite"/>
    </line>
    <path d="M770,201 L770,290 L110,290 L110,201" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Data packets along each connector. -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M197,155 L231,155" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M417,155 L451,155" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M637,155 L671,155" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M770,201 L770,290 L110,290 L110,201" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Nodes (breathing). -->
  <g>
    <rect x="15" y="110" width="180" height="90" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">llama.cpp</text>
    <text x="105" y="170" text-anchor="middle" font-size="11" fill="#0A4F9E">(n-gram probe)</text>

    <rect x="235" y="110" width="180" height="90" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="325" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Heat collector</text>
    <text x="325" y="170" text-anchor="middle" font-size="11" fill="#4B3FC4">(Go)</text>

    <rect x="455" y="110" width="180" height="90" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="545" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Pareto /</text>
    <text x="545" y="170" text-anchor="middle" font-size="11" fill="#0B6B53">working-set</text>

    <rect x="675" y="110" width="180" height="90" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Cold tier</text>
    <text x="765" y="170" text-anchor="middle" font-size="11" fill="#4B3FC4">(mmap SSD + LRU)</text>
  </g>

  <!-- Connector labels (subtle). -->
  <text x="215" y="148" text-anchor="middle" font-size="9" fill="#6E6E73">heat log</text>
  <text x="655" y="148" text-anchor="middle" font-size="9" fill="#6E6E73">report</text>
  <text x="440" y="304" text-anchor="middle" font-size="9" fill="#6E6E73">cold lookups served back</text>
</svg>
